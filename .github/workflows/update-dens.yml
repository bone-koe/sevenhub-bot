name: Auto-update DensTV M3U

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Memberikan izin kepada bot GitHub Actions untuk menyimpan (write/push) ke dalam repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Dependencies
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Scraper DensTV
        run: node scrape-dens.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Tambahkan file hasil output ke dalam antrean Git
          git add dens_all.m3u
          
          # Hanya eksekusi commit & push JIKA benar-benar ada file dens_all.m3u yang berubah
          git diff --staged --quiet || (git commit -m "Auto-update DensTV M3U [skip ci]" && git push)
