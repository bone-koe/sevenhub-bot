name: Auto-update DensTV M3U

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Izin agar bot bisa push hasil playlist ke repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Scraper DensTV
        run: node scrape-dens.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Hanya file playlist yang dimasukkan ke commit
          git add dens_all.m3u

          # Commit & push hanya jika isi dens_all.m3u berubah
          git diff --staged --quiet || (git commit -m "Auto-update DensTV M3U [skip ci]" && git push)
