name: Scraper LayarSkor

on:
  # Hanya bisa dijalankan secara manual (tombol Run workflow) 
  # atau dipicu secara eksternal melalui GitHub API (Cron Eksternal)
  workflow_dispatch: 

# Memberikan izin kepada bot untuk melakukan Push file ke repository
permissions:
  contents: write

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Jalankan Scraper LayarSkor
        run: node layarskor.js

      - name: Commit dan Push Hasil (layarskor.m3u)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add layarskor.m3u
          git commit -m "Update M3U8 LayarSkor (Dipicu Cron Eksternal)" || exit 0
          git push
