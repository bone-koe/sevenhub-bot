name: Resolve Stream URLs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Library
        # Install playwright langsung tanpa butuh package.json baru
        run: npm install playwright

      - name: Install Playwright Chromium + system deps
        run: npx playwright install chromium --with-deps

      - name: Run stream resolver
        # Ubah path karena Anda menaruhnya di root (luar), bukan di folder scripts
        run: node resolve_streams.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push resolved_streams.json
        run: |
          git config user.name  "Stream Resolver Bot"
          git config user.email "bot@noreply.github.com"
          git add resolved_streams.json
          git diff --staged --quiet && echo "No changes, skip commit." || \
            git commit -m "🔄 Resolved streams [$(date -u '+%Y-%m-%d %H:%M UTC')]" && \
            git push
